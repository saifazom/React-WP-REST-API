name: Deploy to Dokploy

on:
  push:
    branches: [main]

permissions:
  deployments: write
  statuses: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Start GitHub Deployment
        id: deployment
        uses: bobheadxi/deployments@v1
        with:
          step: start
          token: ${{ secrets.GITHUB_TOKEN }}
          env: production
          ref: ${{ github.ref }}

      - name: Trigger Dokploy Webhook and Check Status
        id: dokploy
        run: |
          # Trigger deployment
          curl -X POST ${{ secrets.DOKPLOY_WEBHOOK_URL }} \
          -H "Content-Type: application/json" \
          -d "{\"branch\":\"main\",\"sha\":\"$GITHUB_SHA\"}"
          
          # Wait for a moment to let deployment start
          sleep 10
          
          # Check deployment status
          max_attempts=30
          attempt=1
          while [ $attempt -le $max_attempts ]; do
            response=$(curl -s ${{ secrets.DOKPLOY_WEBHOOK_URL }}/status)
            echo "Attempt $attempt: $response"
            
            if [[ $response == *"success"* ]]; then
              echo "Deployment successful!"
              exit 0
            elif [[ $response == *"failed"* ]]; then
              echo "Deployment failed!"
              exit 1
            fi
            
            echo "Waiting for deployment to complete..."
            sleep 10
            attempt=$((attempt + 1))
          done
          
          echo "Deployment timed out"
          exit 1

      - name: Update Deployment Status
        if: always()
        uses: bobheadxi/deployments@v1
        with:
          step: finish
          token: ${{ secrets.GITHUB_TOKEN }}
          status: ${{ job.status }}
          env: production
          deployment_id: ${{ steps.deployment.outputs.deployment_id }}
