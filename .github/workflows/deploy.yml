name: Dokploy Build Check

on:
  push:
    branches: [main]

permissions:
  deployments: write
  statuses: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Start GitHub Deployment
        id: deployment
        uses: bobheadxi/deployments@v1
        with:
          step: start
          token: ${{ secrets.GITHUB_TOKEN }}
          env: production
          ref: ${{ github.ref }}

      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'

      - name: Check and Install Dependencies
        run: |
          if git diff --quiet HEAD^ HEAD package.json; then
            echo "No changes in package.json, using cached dependencies"
            npm ci
          else
            echo "Changes detected in package.json, performing clean install"
            rm -rf node_modules package-lock.json
            npm install
          fi

      - name: Build Project
        id: build
        run: |
          if npm run build; then
            echo "Build successful!"
            exit 0
          else
            echo "Build failed!"
            exit 1
          fi
        env:
          CI: true
          NODE_ENV: production

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1

      - name: Build Docker image
        uses: docker/build-push-action@v2
        with:
          context: .
          push: false
          load: true
          tags: react-kit:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test Docker image
        run: |
          docker run --rm react-kit:test npm run typecheck
          if [ $? -eq 0 ]; then
            echo "Docker image test successful!"
            exit 0
          else
            echo "Docker image test failed!"
            exit 1
          fi

      - name: Update Deployment Status
        if: always()
        uses: bobheadxi/deployments@v1
        with:
          step: finish
          token: ${{ secrets.GITHUB_TOKEN }}
          status: ${{ job.status }}
          env: production
          deployment_id: ${{ steps.deployment.outputs.deployment_id }}
