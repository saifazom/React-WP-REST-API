name: Deploy to Dokploy

on:
  push:
    branches: [main]

permissions:
  deployments: write
  statuses: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Start GitHub Deployment
        id: deployment
        uses: bobheadxi/deployments@v1
        with:
          step: start
          token: ${{ secrets.GITHUB_TOKEN }}
          env: production
          ref: ${{ github.ref }}

      - name: Trigger Dokploy Webhook
        run: |
          $branch = $env:GITHUB_REF -replace 'refs/heads/', ''
          $body = @{
            branch = $branch
            sha = $env:GITHUB_SHA
          } | ConvertTo-Json
          
          Invoke-RestMethod -Uri $env:DOKPLOY_WEBHOOK_URL -Method Post -Body $body -ContentType 'application/json'
        shell: pwsh

      - name: Finish GitHub Deployment (Success)
        if: success()
        uses: bobheadxi/deployments@v1
        with:
          step: finish
          status: success
          token: ${{ secrets.GITHUB_TOKEN }}
          env: production
          deployment_id: ${{ steps.deployment.outputs.deployment_id }}

      - name: Finish GitHub Deployment (Failure)
        if: failure()
        uses: bobheadxi/deployments@v1
        with:
          step: finish
          status: failure
          token: ${{ secrets.GITHUB_TOKEN }}
          env: production
          deployment_id: ${{ steps.deployment.outputs.deployment_id }}
