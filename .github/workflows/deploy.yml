name: Dokploy Build Check

on:
  push:
    branches: [main]

permissions:
  deployments: write
  statuses: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Start GitHub Deployment
        id: deployment
        uses: bobheadxi/deployments@v1
        with:
          step: start
          token: ${{ secrets.GITHUB_TOKEN }}
          env: production
          ref: ${{ github.ref }}

      - name: Checkout code
        uses: actions/checkout@v3
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'
          fetch-depth: 2

      - name: Check and Install Dependencies
        run: |
          if git diff --quiet HEAD^ HEAD package.json; then
            echo "No changes in package.json, using npm ci"
            npm ci
          else
            echo "Changes detected in package.json, performing clean install"
            rm -rf node_modules package-lock.json
            npm install
          fi

      - name: Build Project
        id: build
        run: |
          if npm run build; then
            echo "Build successful!"
            exit 0
          else
            echo "Build failed!"
            exit 1
          fi
        env:
          CI: true
          NODE_ENV: production

      - name: Check Dokploy Status
        run: |
          max_attempts=30
          attempt=1
          while [ $attempt -le $max_attempts ]; do
            response=$(curl -X GET "https://app.cofixer.dev/api/deployment.all?applicationId=${{ secrets.DOKPLOY_APP_ID }}" \
            -H "Content-Type: application/json")
            
            # Check if response is empty or invalid
            if [ -z "$response" ]; then
              echo "Empty response received"
              sleep 10
              attempt=$((attempt + 1))
              continue
            fi
            
            # Parse JSON response safely
            if echo "$response" | jq -e . >/dev/null 2>&1; then
              # Get the latest deployment status
              latest_status=$(echo "$response" | jq -r 'if length > 0 then .[0].status else "unknown" end')
              latest_title=$(echo "$response" | jq -r 'if length > 0 then .[0].title else "unknown" end')
              latest_time=$(echo "$response" | jq -r 'if length > 0 then .[0].createdAt else "unknown" end')
              
              echo "Latest deployment:"
              echo "Title: $latest_title"
              echo "Status: $latest_status"
              echo "Time: $latest_time"
              
              if [[ "$latest_status" == "done" ]]; then
                echo "✅ Deployment successful!"
                exit 0
              elif [[ "$latest_status" == "failed" ]]; then
                error_msg=$(echo "$response" | jq -r 'if length > 0 then .[0].errorMessage else "unknown error" end')
                echo "❌ Deployment failed: $error_msg"
                exit 1
              fi
            else
              echo "Invalid JSON response received"
              echo "Response: $response"
            fi
            
            echo "⏳ Waiting for deployment to complete... (Attempt $attempt of $max_attempts)"
            sleep 10
            attempt=$((attempt + 1))
          done
          
          echo "⚠️ Deployment status check timed out"
          exit 1
