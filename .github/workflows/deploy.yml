name: Dokploy Build Check

on:
  push:
    branches: [main]

permissions:
  deployments: write
  statuses: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Start GitHub Deployment
        id: deployment
        uses: bobheadxi/deployments@v1
        with:
          step: start
          token: ${{ secrets.GITHUB_TOKEN }}
          env: production
          ref: ${{ github.ref }}

      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 2

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --prefer-offline --no-audit --no-optional
          else
            npm install --no-optional --no-audit
          fi
          npm install @rollup/rollup-linux-x64-gnu --save-optional --no-audit

      - name: Build Project
        id: build
        run: |
          if npm run build; then
            echo "Build successful!"
            exit 0
          else
            echo "Build failed!"
            exit 1
          fi
        env:
          CI: true
          NODE_ENV: production

      - name: Update Deployment Status
        if: always()
        uses: bobheadxi/deployments@v1
        with:
          step: finish
          token: ${{ secrets.GITHUB_TOKEN }}
          status: ${{ job.status }}
          env: production
          deployment_id: ${{ steps.deployment.outputs.deployment_id }}
